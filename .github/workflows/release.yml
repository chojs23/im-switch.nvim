name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asset_os: linux
          - runner: macos-latest
            asset_os: macos
          - runner: windows-latest
            asset_os: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build asset
        id: build
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "macOS" ]; then
            export CGO_ENABLED=1
          else
            export CGO_ENABLED=0
          fi

          binary_name="im-switch"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          go build -ldflags="-X main.version=${{ github.ref_name }}" -o "${binary_name}" .

          asset_name="im-switch-${{ matrix.asset_os }}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            asset_name="${asset_name}.exe"
          fi

          mv "${binary_name}" "${asset_name}"
          if [ "${RUNNER_OS}" != "Windows" ]; then
            chmod +x "${asset_name}"
          fi

          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          "./${{ steps.build.outputs.asset_name }}" -h
          "./${{ steps.build.outputs.asset_name }}" --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\${{ steps.build.outputs.asset_name }} -h
          .\${{ steps.build.outputs.asset_name }} --version

      - name: Package and checksum (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive_name="${{ steps.build.outputs.asset_name }}.tar.gz"
          tar -czf "${archive_name}" "${{ steps.build.outputs.asset_name }}"
          shasum -a 256 "${archive_name}" > "${archive_name}.sha256"

      - name: Package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $archiveName = "${{ steps.build.outputs.asset_name }}.zip"
          Compress-Archive -Path "${{ steps.build.outputs.asset_name }}" -DestinationPath $archiveName

          $hash = (Get-FileHash -Algorithm SHA256 -Path $archiveName).Hash.ToLower()
          "$hash  $archiveName" | Out-File -Encoding ASCII "$archiveName.sha256"

      - name: Upload asset (macOS/Linux)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: im-switch-${{ matrix.asset_os }}
          path: |
            ${{ steps.build.outputs.asset_name }}.tar.gz
            ${{ steps.build.outputs.asset_name }}.tar.gz.sha256

      - name: Upload asset (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: im-switch-${{ matrix.asset_os }}
          path: |
            ${{ steps.build.outputs.asset_name }}.zip
            ${{ steps.build.outputs.asset_name }}.zip.sha256

  release:
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/**
